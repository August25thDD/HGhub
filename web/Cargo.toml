[package]
name = "hghub-web"
version = "1.2.1"
edition = "2021"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"

[features]
default = ["web"]
web = []

[dependencies]
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "gzip", "brotli", "json", "charset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
opt-level = "s"
